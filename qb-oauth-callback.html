<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="header-inner">
    <a class="brand" href="index.html">
      <svg class="brand-badge" width="36" height="36" viewBox="0 0 40 40" aria-hidden="true">
        <defs><linearGradient id="gHeader" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#276B62"/><stop offset="1" stop-color="#153729"/></linearGradient></defs>
        <rect width="40" height="40" rx="11" fill="url(#gHeader)"/>
        <text x="20" y="27" font-family="Fraunces, Georgia, serif" font-weight="900" font-size="21" fill="#F8F4E8" text-anchor="middle">M</text>
        <circle cx="32.5" cy="7.5" r="3.1" fill="#D9A441"/>
      </svg>
      <span class="brand-word"><b>MAA</b><span> Gestion</span></span>
    </a>
  </div>
</header>

<main class="legal">
  <h1>Connexion à QuickBooks...</h1>
  <p id="msg">Redirection vers MAA Gestion en cours — cette fenêtre se ferme automatiquement.</p>
  <noscript>
    <div class="placeholder">JavaScript est requis pour compléter la connexion. Activez JavaScript et rechargez cette page, ou retournez dans MAA Gestion et réessayez.</div>
  </noscript>
</main>

<footer>
  <div class="footer-inner">
    <span>© 2026 Groupe Gestion MAA (MAA Gestion). Tous droits réservés.</span>
  </div>
</footer>

<script>
  // MAA Gestion est une app de bureau : Intuit n'autorise pas
  // http://localhost comme URI de redirection en production (seulement en
  // sandbox), donc cette page publique reçoit le retour d'Intuit ici, puis
  // relaie IMMÉDIATEMENT vers le petit serveur local que l'app a démarré
  // sur ce même ordinateur (voir Services/QuickBooksService.cs, LocalPort).
  // C'est le NAVIGATEUR DU CLIENT qui fait cette deuxième requête, pas ce
  // serveur web — il peut donc atteindre localhost sans problème.
  var LOCAL_PORT = 51728;
  var params = window.location.search; // déjà "?code=...&state=...&realmId=..."
  if (params) {
    window.location.replace("http://localhost:" + LOCAL_PORT + "/callback/" + params);
  } else {
    document.getElementById("msg").textContent = "Aucune information de connexion reçue — retournez dans MAA Gestion et réessayez.";
  }
</script>
</body>
</html>
